<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="calculator" id="calculator">
            <header class="calculator-header">
                <h1>Calculator</h1>

                <!-- Toggle stays in exactly the same top-right position -->
                <div class="mode-control">
                    <span id="modeLabel">Left-handed</span>
                    <button
                        class="switch"
                        id="handednessToggle"
                        type="button"
                        aria-label="Switch to left-handed layout"
                        aria-pressed="false"
                    >
                        <span class="switch-knob"></span>
                    </button>
                </div>
            </header>

            <section class="display" aria-live="polite">
                <div class="expression" id="expression">125 + 25</div>
                <div class="result" id="result">=150</div>
            </section>

            <section class="keypad" id="keypad">
                <!-- These are logical calculator keys.
                     CSS Grid changes their visual order for left-handed mode. -->
                <button class="key utility" data-action="clear">AC</button>
                <button class="key utility" data-action="backspace">⌫</button>
                <button class="key utility" data-action="percent">%</button>
                <button class="key operator" data-value="÷">÷</button>

                <button class="key number" data-value="7">7</button>
                <button class="key number" data-value="8">8</button>
                <button class="key number" data-value="9">9</button>
                <button class="key operator" data-value="×">×</button>

                <button class="key number" data-value="4">4</button>
                <button class="key number" data-value="5">5</button>
                <button class="key number" data-value="6">6</button>
                <button class="key operator" data-value="−">−</button>

                <button class="key number" data-value="1">1</button>
                <button class="key number" data-value="2">2</button>
                <button class="key number" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key utility" data-action="power">^</button>
                <button class="key number" data-value="0">0</button>
                <button class="key number" data-value=".">.</button>
                <button class="key equals" data-action="equals">=</button>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
